<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - HP Bank</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-side">
    <a href="index.html" class="logo" style="font-size:1.8rem;margin-bottom:30px">HP <span>Bank</span></a>
    <div class="tagline">Hamara Paisa, Hamara Bharosa</div>
    <h1>Welcome to<br>smart banking</h1>
    <ul>
      <li>Send money in seconds</li>
      <li>Track every transaction</li>
      <li>Apply for loans online</li>
      <li>Safe and easy to use</li>
    </ul>
  </div>

  <div class="auth-box">
    <div class="auth-card">
      <a href="index.html" class="logo" style="color:var(--blue);display:block;margin-bottom:16px">HP <span>Bank</span></a>
      <div class="tabs">
        <button id="tabLogin" class="active">Login</button>
        <button id="tabReg">Open Account</button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm">
        <div id="lMsg" class="msg"></div>
        <div class="field"><label>Email</label><input type="email" id="lEmail" placeholder="you@example.com" required></div>
        <div class="field"><label>Password</label><input type="password" id="lPass" placeholder="Enter password" required></div>
        <button class="btn btn-primary btn-block">Login</button>
        <p class="hint">
          Demo customer: <b>rahul@demo.com</b> / <b>1234</b><br>
          Demo admin: <b>admin@demo.com</b> / <b>admin123</b>
        </p>
      </form>

      <!-- REGISTER -->
      <form id="regForm" style="display:none">
        <div id="rMsg" class="msg"></div>
        <div class="field"><label>Full Name</label><input id="rName" required></div>
        <div class="field"><label>Email</label><input type="email" id="rEmail" required></div>
        <div class="form-grid">
          <div class="field"><label>Mobile (10 digits)</label><input id="rPhone" inputmode="numeric" maxlength="10" required></div>
          <div class="field"><label>City</label><input id="rCity"></div>
        </div>
        <div class="form-grid">
          <div class="field"><label>Account Type</label>
            <select id="rType"><option>Savings</option><option>Current</option></select></div>
          <div class="field"><label>Opening Deposit (₹)</label><input type="number" id="rOpen" min="500" value="1000" required></div>
        </div>
        <div class="field"><label>Password</label><input type="password" id="rPass" minlength="4" required></div>
        <button class="btn btn-primary btn-block">Create Account</button>
        <p class="hint">Minimum opening deposit is ₹500.</p>
      </form>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script>
  const cur = Api.current();
  if (cur) location.href = cur.role === 'admin' ? 'admin.html' : 'app.html';

  const $ = id => document.getElementById(id);
  function showTab(reg) {
    $('loginForm').style.display = reg ? 'none' : 'block';
    $('regForm').style.display = reg ? 'block' : 'none';
    $('tabLogin').classList.toggle('active', !reg);
    $('tabReg').classList.toggle('active', reg);
  }
  $('tabLogin').onclick = () => showTab(false);
  $('tabReg').onclick = () => showTab(true);
  if (new URLSearchParams(location.search).get('tab') === 'register') showTab(true);

  function msg(id, text, ok) { const m = $(id); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }

  $('loginForm').onsubmit = e => {
    e.preventDefault();
    const r = Api.login($('lEmail').value, $('lPass').value);
    if (!r.ok) return msg('lMsg', r.msg);
    location.href = r.user.role === 'admin' ? 'admin.html' : 'app.html';
  };

  $('regForm').onsubmit = e => {
    e.preventDefault();
    const r = Api.register({
      name: $('rName').value, email: $('rEmail').value, phone: $('rPhone').value,
      city: $('rCity').value, accType: $('rType').value, opening: $('rOpen').value, password: $('rPass').value
    });
    if (!r.ok) return msg('rMsg', r.msg);
    msg('rMsg', 'Account created! Account number: ' + r.user.accNo + '. Logging in...', true);
    Api.login($('rEmail').value, $('rPass').value);
    setTimeout(() => location.href = 'app.html', 1500);
  };
</script>
</body>
</html>
