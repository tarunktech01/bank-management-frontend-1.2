<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account - HP Bank</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="logo">HP <span>Bank</span></div>
    <a data-page="dashboard" class="active">🏠 Dashboard</a>
    <a data-page="transfer">💸 Fund Transfer</a>
    <a data-page="money">🏧 Deposit / Withdraw</a>
    <a data-page="bills">🧾 Bills &amp; Recharge</a>
    <a data-page="scheme">🎉 Double Dhamaka</a>
    <a data-page="history">📜 Transactions</a>
    <a data-page="loans">🏦 Loans &amp; EMI</a>
    <a data-page="profile">👤 Profile</a>
    <a id="logoutLink">🚪 Logout</a>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="burger" id="burger" aria-label="Menu">☰</button>
        <div class="tb-brand"><div class="tb-bank">🏦 HP Bank</div><h2 id="pageTitle">Dashboard</h2></div>
      </div>
      <div class="top-right">
        <button class="icon-btn" id="themeBtn" title="Dark mode">🌙</button>
        <div style="position:relative">
          <button class="icon-btn" id="bellBtn" title="Notifications">🔔<span class="badge" id="badge" style="display:none">0</span></button>
          <div class="notif" id="notif"></div>
        </div>
        <div class="avatar" id="avatar">U</div>
      </div>
    </div>

    <div class="content">
      <div class="page active" id="p-dashboard"></div>
      <div class="page" id="p-transfer"></div>
      <div class="page" id="p-money"></div>
      <div class="page" id="p-bills"></div>
      <div class="page" id="p-scheme"></div>
      <div class="page" id="p-history"></div>
      <div class="page" id="p-loans"></div>
      <div class="page" id="p-profile"></div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
